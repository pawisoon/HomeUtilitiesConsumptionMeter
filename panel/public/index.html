<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5a66">
<title>Liczniki — zużycie mediów w domu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Runs before the stylesheet paints, so a remembered dark choice does not
  // arrive as a white flash. Light stays the default when nothing is stored.
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}
</script>
<link rel="stylesheet" href="/style.css?v=202609180947">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='19'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="wash" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <span class="brand-emoji" id="brandEmoji" aria-hidden="true">📊</span>
    <h1 id="brandLabel" data-i18n="brand">Liczniki</h1>
  </div>
  <div class="top-right">
    <p class="reading" id="lastReading" data-i18n="loading">wczytuję…</p>
    <div class="controls">
      <button class="ghost" id="logout" type="button" data-i18n="logout">Wyloguj</button>
      <button class="theme" id="theme" type="button" data-i18n-aria="themeToggle">🌙</button>
      <button class="theme" id="language" type="button" data-i18n-aria="languageToggle">PL</button>
    </div>
  </div>
</header>

<!-- Utility switcher; stays hidden while only one utility is configured. -->
<nav class="utils" id="utils" hidden data-i18n-aria="utilityPicker"></nav>

<main>
  <!-- The one number the household actually asks about. -->
  <section class="hero reveal" style="--d:0ms">
    <p class="eyebrow" id="heroLabel" data-i18n="yesterday">Wczoraj</p>
    <p class="bignum"><span id="heroValue">—</span><span class="unit" id="heroUnit"></span></p>
    <p class="hero-sub">
      <span class="pill" id="heroPerPerson">—</span>
      <span class="delta" id="heroDelta"></span>
    </p>
    <p class="hero-note" id="heroNote"></p>
    <p class="hero-today" id="heroToday" hidden></p>
  </section>

  <!-- Household size is what makes the per-person figures mean anything. -->
  <section class="card reveal" style="--d:60ms">
    <h2 data-i18n="householdQuestion">Ile osób w domu?</h2>
    <p class="card-sub" id="occToday" data-i18n="householdToday">dzisiaj</p>
    <div class="persons" id="personsToday" role="group" data-i18n-aria="peopleToday"></div>
    <button class="link" id="toggleHistory" type="button" aria-expanded="false" data-i18n="fixEarlier">Popraw wcześniejsze dni</button>
    <div class="history" id="history" hidden></div>
  </section>

  <section class="grid">
    <article class="card stat reveal" style="--d:120ms">
      <h2 data-i18n="thisWeek">Ten tydzień</h2>
      <p class="num" id="weekNow">—</p>
      <p class="cmp" id="weekCmp">—</p>
    </article>
    <article class="card stat reveal" style="--d:160ms">
      <h2 data-i18n="thisMonth">Ten miesiąc</h2>
      <p class="num" id="monthNow">—</p>
      <p class="cmp" id="monthCmp">—</p>
    </article>
    <article class="card stat reveal" style="--d:200ms">
      <h2 data-i18n="avgPerPerson">Średnia na osobę</h2>
      <p class="num" id="avgPerson">—</p>
      <p class="cmp" id="avgPersonSub" data-i18n="dailyPerPerson">ostatnie 30 dni</p>
    </article>
    <article class="card stat reveal" style="--d:240ms">
      <h2 data-i18n="specialDays">Święta i weekendy</h2>
      <p class="num" id="specialNum">—</p>
      <p class="cmp" id="specialCmp">—</p>
    </article>
  </section>

  <section class="card chart-card reveal" style="--d:300ms">
    <div class="tabs" id="tabs" role="tablist">
      <button role="tab" class="tab is-on" data-view="day" data-i18n="tabDay">Dzień</button>
      <button role="tab" class="tab" data-view="30" data-i18n="tab30">30 dni</button>
      <button role="tab" class="tab" data-view="90" data-i18n="tab90">90 dni</button>
      <button role="tab" class="tab" data-view="week" data-i18n="tabWeeks">Tygodnie</button>
      <button role="tab" class="tab" data-view="month" data-i18n="tabMonths">Miesiące</button>
      <button role="tab" class="tab" data-view="all" data-i18n="tabAll">Wszystko</button>
    </div>
    <div class="daypick" id="dayPick">
      <button class="daybtn" id="dayPrev" type="button" data-i18n-aria="prevDay">‹</button>
      <button class="dayfield" id="dayField" type="button" aria-haspopup="dialog"
              aria-expanded="false" data-i18n-aria="openCalendar"></button>
      <button class="daybtn" id="dayNext" type="button" data-i18n-aria="nextDay">›</button>
      <div class="calendar" id="calendar" role="dialog" aria-modal="false" hidden
           data-i18n-aria="pickDay">
        <div class="cal-head">
          <button class="calnav" id="calPrev" type="button" data-i18n-aria="prevMonth">‹</button>
          <span class="calmonth" id="calMonth"></span>
          <button class="calnav" id="calNext" type="button" data-i18n-aria="nextMonth">›</button>
        </div>
        <div class="cal-week" id="calWeek"></div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <p class="daysum" id="daySum"></p>
    </div>
    <div class="chart-wrap"><canvas id="chart" data-i18n-aria="chartLabel"></canvas></div>
    <p class="legend">
      <span class="key key-normal"></span> <span data-i18n="legendNormal">zwykły dzień</span>
      <span class="key key-holiday"></span> <span data-i18n="legendHoliday">święto</span>
      <span class="key key-weekend"></span> <span data-i18n="weekend">weekend</span>
      <span class="key key-estimate"></span> <span data-i18n="legendEstimate">szacunek (tylko dni)</span>
    </p>
  </section>

  <section class="card reveal" style="--d:340ms">
    <h2 data-i18n="holidaysTitle">Święta w liczbach</h2>
    <div class="holidays" id="holidayList"><p class="empty" data-i18n="collecting">Zbieram dane…</p></div>
  </section>
</main>

<footer>
  <p id="meta">—</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="/i18n.js?v=202609180947"></script>
<script src="/app.js?v=202609180947"></script>
</body>
</html>
