<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5a66">
<title>Liczniki — zużycie mediów w domu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=202609101259">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='19'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="wash" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <span class="brand-emoji" id="brandEmoji" aria-hidden="true">📊</span>
    <h1 id="brandLabel">Liczniki</h1>
  </div>
  <div class="top-right">
    <p class="reading" id="lastReading">wczytuję…</p>
    <button class="ghost" id="logout" type="button">Wyloguj</button>
  </div>
</header>

<!-- Utility switcher; stays hidden while only one utility is configured. -->
<nav class="utils" id="utils" hidden aria-label="Wybór medium"></nav>

<main>
  <!-- The one number the household actually asks about. -->
  <section class="hero reveal" style="--d:0ms">
    <p class="eyebrow" id="heroLabel">Wczoraj</p>
    <p class="bignum"><span id="heroValue">—</span><span class="unit" id="heroUnit"></span></p>
    <p class="hero-sub">
      <span class="pill" id="heroPerPerson">—</span>
      <span class="delta" id="heroDelta"></span>
    </p>
    <p class="hero-note" id="heroNote"></p>
    <p class="hero-today" id="heroToday" hidden></p>
  </section>

  <!-- Household size is what makes the per-person figures mean anything. -->
  <section class="card reveal" style="--d:60ms">
    <h2>Ile osób w domu?</h2>
    <p class="card-sub" id="occToday">dzisiaj</p>
    <div class="persons" id="personsToday" role="group" aria-label="Liczba osób dzisiaj"></div>
    <button class="link" id="toggleHistory" type="button" aria-expanded="false">Popraw wcześniejsze dni</button>
    <div class="history" id="history" hidden></div>
  </section>

  <section class="grid">
    <article class="card stat reveal" style="--d:120ms">
      <h2>Ten tydzień</h2>
      <p class="num" id="weekNow">—</p>
      <p class="cmp" id="weekCmp">—</p>
    </article>
    <article class="card stat reveal" style="--d:160ms">
      <h2>Ten miesiąc</h2>
      <p class="num" id="monthNow">—</p>
      <p class="cmp" id="monthCmp">—</p>
    </article>
    <article class="card stat reveal" style="--d:200ms">
      <h2>Średnia na osobę</h2>
      <p class="num" id="avgPerson">—</p>
      <p class="cmp" id="avgPersonSub">ostatnie 30 dni</p>
    </article>
    <article class="card stat reveal" style="--d:240ms">
      <h2>Święta i weekendy</h2>
      <p class="num" id="specialNum">—</p>
      <p class="cmp" id="specialCmp">—</p>
    </article>
  </section>

  <section class="card chart-card reveal" style="--d:300ms">
    <div class="tabs" id="tabs" role="tablist">
      <button role="tab" class="tab is-on" data-view="day">Dzień</button>
      <button role="tab" class="tab" data-view="30">30 dni</button>
      <button role="tab" class="tab" data-view="90">90 dni</button>
      <button role="tab" class="tab" data-view="week">Tygodnie</button>
      <button role="tab" class="tab" data-view="month">Miesiące</button>
      <button role="tab" class="tab" data-view="all">Wszystko</button>
    </div>
    <div class="daypick" id="dayPick">
      <button class="daybtn" id="dayPrev" type="button" aria-label="Poprzedni dzień">‹</button>
      <input class="dayinput" id="dayInput" type="date" aria-label="Wybierz dzień">
      <button class="daybtn" id="dayNext" type="button" aria-label="Następny dzień">›</button>
      <p class="daysum" id="daySum"></p>
    </div>
    <div class="chart-wrap"><canvas id="chart" aria-label="Wykres zużycia"></canvas></div>
    <p class="legend">
      <span class="key key-normal"></span> zwykły dzień
      <span class="key key-holiday"></span> święto
      <span class="key key-weekend"></span> weekend
      <span class="key key-estimate"></span> szacunek (tylko dni)
    </p>
  </section>

  <section class="card reveal" style="--d:340ms">
    <h2>Święta w liczbach</h2>
    <div class="holidays" id="holidayList"><p class="empty">Zbieram dane…</p></div>
  </section>
</main>

<footer>
  <p id="meta">—</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="/app.js?v=202609101259"></script>
</body>
</html>
